name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/android-sdk}}"
          echo "Using SDK at: $SDK_ROOT"
          mkdir -p "$SDK_ROOT"
          if [ ! -d "$SDK_ROOT/cmdline-tools/latest" ]; then
            curl -sLo /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/cmdline-tools.zip -d "$SDK_ROOT"
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            mv "$SDK_ROOT/cmdline-tools/bin" "$SDK_ROOT/cmdline-tools/lib" \
               "$SDK_ROOT/cmdline-tools/NOTICE.txt" "$SDK_ROOT/cmdline-tools/source.properties" \
               "$SDK_ROOT/cmdline-tools/latest/" 2>/dev/null || true
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" 2>&1 | tail -5
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true

      - name: Set up signing
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore.jks
          cat > keystore.properties <<EOF
          storeFile=release.keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --parallel

      - name: Rename APK
        run: |
          ls -la app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk \
             HeartRate-${{ github.ref_name }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            HeartRate-*.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
